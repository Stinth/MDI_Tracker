<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Magisters' Terrace</title>
</head>
<body>
    <div class="image-container">
        <!-- <img src="dungeon_timelines/arakara-city-of-echoes.png" alt="Description"> -->
        <img src="images/mt.png" alt="Description">
    </div>
    
        <!-- Dropdown menu -->
        <select id="pageSelect" onchange="navigate()">
            <option value="">Select a dungeon</option>
            <option value="aa.html">Algeth'ar Academy</option>
            <!-- <option value="eco.html">Eco-Dome Al'dani</option> -->
            <option value="mt.html">Magisters' Terrace</option>
            <option value="mc.html">Maisara Caverns</option>
            <option value="pit.html">Pit of Saron</option>
            <option value="seat.html">Seat of the Triumvirate</option>
            <option value="spire.html">Windrunner Spire</option>
            <option value="sky.html">Skyreach</option>
            <option value="npx.html">Nexus-Point Xenas</option>
        </select>

    <!-- JavaScript to handle page navigation -->
    <script>
        function navigate() {
            var select = document.getElementById("pageSelect");
            var selectedPage = select.options[select.selectedIndex].value;
            if (selectedPage) {
                window.location.href = selectedPage;
            }
        }
    </script>
</body>
</html>
